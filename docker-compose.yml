# Unified Docker Compose for Todo App
# Run all services together:
#   docker compose up -d --build
#
# Services:
#   - db:  PostgreSQL 16 (port 5433:5432)
#   - api: AdonisJS 5 REST API (http://localhost:3333)
#   - web: Vue 3 + Nginx Frontend (http://localhost:8080)
services:
  db:
    image: postgres:16-alpine
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_db
    ports:
      - '5433:5432'
    volumes:
      - todo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d todo_db']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./todo-backend/todo-backend
    container_name: todo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      APP_NAME: todo-api
      APP_KEY: ${APP_KEY:-TSLZJqGusugRfTHd6a0wyLYqVv1c0RbB}
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DB_NAME: todo_db
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
    ports:
      - '3333:3333'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3333/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./todo-frontend/todo-frontend
      args:
        VITE_API_BASE_URL: http://localhost:3333/api
    container_name: todo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  todo_pgdata:
