# Local development
#   docker compose up -d db            PostgreSQL only (run the API on your machine with `npm run dev`)
#   docker compose up -d --build       PostgreSQL + the API in Docker (http://localhost:3333)
#
# APP_KEY is read from your `.env` file (or the shell). Generate one with:
#   node ace generate:key        or        openssl rand -base64 24 | tr '+/' '-_'
services:
  db:
    image: postgres:16-alpine
    container_name: todo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_db
    ports:
      - '5433:5432'
    volumes:
      - todo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d todo_db']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: todo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      APP_NAME: todo-api
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env (see the comment at the top of this file)}
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DB_NAME: todo_db
      # Frontend origins allowed by CORS: Vite dev server and the Docker (nginx) frontend
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
    ports:
      - '3333:3333'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3333/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  todo_pgdata:
